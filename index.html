<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css"/>
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>Dice Rolling Luck</h1>
        <h2 class="who-won">Who win?</h2>
        <div class="game-display">
            <div class="player-one-heading"><h3>Player 1 got : __</h3></div>
            <div class="player-two-heading"><h3>Player 2 got : __</h3></div>
            <div id="player-one-dice">
                <div class="dice">
                    <div class="dice-numbers-row row-top">
                        <div class="circle"></div>
                        <div class="circle"></div>
                    </div>
                    <div class="dice-numbers-row row-middle">
                        <div class="circle"></div>
                        <div class="circle"></div>
                    </div>
                    <div class="dice-numbers-row row-bottom">
                        <div class="circle"></div>
                        <div class="circle"></div>
                    </div>
                </div>
            </div>
            <div id="player-two-dice">
                <div class="dice">
                    <div class="dice-numbers-row row-top">
                        <div class="circle"></div>
                        <div class="circle"></div>
                    </div>
                    <div class="dice-numbers-row row-middle">
                        <div class="circle"></div>
                        <div class="circle"></div>
                    </div>
                    <div class="dice-numbers-row row-bottom">
                        <div class="circle"></div>
                        <div class="circle"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
